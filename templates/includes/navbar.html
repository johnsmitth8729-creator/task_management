    <div class="container-fluid">
        <button class="btn btn-outline-secondary d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar" aria-controls="mobileSidebar" aria-label="{% trans 'Open menu' %}">
            <i class="bi bi-list"></i>
        </button>
        <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">{% trans "TASK MANAGEMENT" %}</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            {% include "includes/language_switcher.html" %}
            <span class="text-muted small d-none d-md-inline">{{ user.display_name }}</span>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button class="btn btn-outline-danger btn-sm" type="submit">
                    <i class="bi bi-box-arrow-right"></i>
                    <span class="d-none d-sm-inline">{% trans "Logout" %}</span>
                </button>
            </form>
        </div>
    </div>
