{% load i18n static %}
<!-- Desktop Sidebar -->
<aside class="app-sidebar d-none d-lg-flex" aria-label="{% trans 'Main Navigation' %}">
    <nav class="nav flex-column w-100 sidebar-nav-container">
        {% include "includes/sidebar_menu.html" with nav_id_prefix="desktop" %}

        <!-- BOTTOM ACCOUNT / LOGOUT -->
        <div class="sidebar-account-footer mt-auto pt-2 border-top">
            <a class="nav-link" href="{% url 'profile' %}" data-bs-title="{% trans 'My Profile' %}">
                <i class="bi bi-person-circle"></i>
                <span>{% trans "My Profile" %}</span>
            </a>
            <form action="{% url 'logout' %}" method="post" class="m-0">
                {% csrf_token %}
                <button class="nav-link text-danger w-100 text-start border-0 bg-transparent" type="submit" data-bs-title="{% trans 'Logout' %}">
                    <i class="bi bi-box-arrow-right"></i>
                    <span>{% trans "Logout" %}</span>
                </button>
            </form>
        </div>
    </nav>
</aside>

<!-- Mobile Offcanvas Drawer Sidebar -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
    <div class="offcanvas-header border-bottom py-3">
        <a class="navbar-brand d-flex align-items-center gap-2 py-0 text-decoration-none" href="{% url 'dashboard' %}">
            <img src="{% static 'images/logo-dark.png' %}" alt="Al-Xorazmiy Universiteti" class="brand-logo-img logo-dark-variant">
            <img src="{% static 'images/logo-light.png' %}" alt="Al-Xorazmiy Universiteti" class="brand-logo-img logo-light-variant">
            <span class="fw-bold fs-6">{% trans "Al-Khwarizmi University" %}</span>
        </a>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="{% trans 'Close' %}"></button>
    </div>
    <div class="offcanvas-body p-3">
        <nav class="nav flex-column w-100 sidebar-nav-container">
            {% include "includes/sidebar_menu.html" with nav_id_prefix="mobile" %}

            <!-- BOTTOM ACCOUNT / LOGOUT -->
            <div class="sidebar-account-footer mt-auto pt-2 border-top">
                <a class="nav-link" href="{% url 'profile' %}" data-bs-title="{% trans 'My Profile' %}">
                    <i class="bi bi-person-circle"></i>
                    <span>{% trans "My Profile" %}</span>
                </a>
                <form action="{% url 'logout' %}" method="post" class="m-0">
                    {% csrf_token %}
                    <button class="nav-link text-danger w-100 text-start border-0 bg-transparent" type="submit" data-bs-title="{% trans 'Logout' %}">
                        <i class="bi bi-box-arrow-right"></i>
                        <span>{% trans "Logout" %}</span>
                    </button>
                </form>
            </div>
        </nav>
    </div>
</div>
