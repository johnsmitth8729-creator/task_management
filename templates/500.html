<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Server Error | TASK MANAGEMENT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --bs-body-bg: #f8fafc;
            --bs-body-color: #1e293b;
        }
        [data-bs-theme="dark"] {
            --bs-body-bg: #0f172a;
            --bs-body-color: #f1f5f9;
        }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bs-body-bg);
            color: var(--bs-body-color);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 text-center">
                <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                    <div class="mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-warning-subtle text-warning p-4 mb-2" style="width: 100px; height: 100px;">
                            <i class="bi bi-exclamation-triangle-fill fs-1"></i>
                        </div>
                        <div class="display-3 fw-bold font-monospace text-warning mt-2">500</div>
                        <h2 class="h4 fw-bold text-dark mb-2">Server Error / Tizimda xatolik</h2>
                        <p class="text-muted mb-0">
                            An unexpected server error occurred while processing your request. The technical team has been notified.
                        </p>
                    </div>

                    <div class="d-flex flex-column flex-sm-row justify-content-center gap-2 pt-3 border-top">
                        <button type="button" onclick="window.history.back()" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-arrow-left me-1"></i>Go Back / Qaytish
                        </button>
                        <a href="/" class="btn btn-primary px-4">
                            <i class="bi bi-house me-1"></i>Home / Bosh sahifa
                        </a>
                    </div>
                </div>
                <div class="text-muted small mt-4">
                    &copy; Al-Khwarizmi University. All rights reserved.
                </div>
            </div>
        </div>
    </div>
</body>
</html>
